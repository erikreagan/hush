<!doctype html>
<html>
	<head lang="en">
		<title>Preset</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<!-- Empty: each press moves to the next preset whose microphone is connected. A name: the key always selects that preset. -->
		<sdpi-item label="Preset name">
			<sdpi-textfield setting="name" placeholder="Empty = next preset"></sdpi-textfield>
		</sdpi-item>
		<!-- Shared by every Hush key (global setting). Only change it if you changed the port in Hush's Settings. -->
		<sdpi-item label="Hush port">
			<sdpi-textfield setting="port" global placeholder="47823"></sdpi-textfield>
		</sdpi-item>
	</body>
</html>
